databaseChangeLog:
  - changeSet:
      id: property-costs-table
      author: wojtek-a
      changes:
        - createTable:
            tableName: property_costs
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: property_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: utility_invoice_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: billing_month
                  type: varchar(7)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: varchar(255)
        - addForeignKeyConstraint:
            baseTableName: property_costs
            baseColumnNames: property_id
            referencedTableName: properties
            referencedColumnNames: id
            constraintName: fk_property_costs_properties
        - addForeignKeyConstraint:
            baseTableName: property_costs
            baseColumnNames: utility_invoice_id
            referencedTableName: utility_invoices
            referencedColumnNames: id
            constraintName: fk_property_costs_utility_invoices
